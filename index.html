<meta name="theme-color" content="#111111"/>
<title>Daily Manpower</title>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body,#root{height:100%;background:#111;color:#f0f0f0;font-family:'Georgia','Times New Roman',serif}
  input,textarea,button{font-family:inherit}
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
  ::-webkit-scrollbar{width:4px;background:#111}
  ::-webkit-scrollbar-thumb{background:#333;border-radius:4px}
  @keyframes fadeout{0%{opacity:1}60%{opacity:1}100%{opacity:0}}
  .note-card:hover{box-shadow:0 4px 24px rgba(0,0,0,.5);transform:translateY(-2px)}
  @media(max-width:500px){.modal-inner{padding:16px 14px!important}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;
const A="#f5c842";
const GR="#7ecf7e";

// ── Persistence ───────────────────────────────────────────────────────────────
const load=(k,fb)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb}catch{return fb}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};

// ── Defaults ──────────────────────────────────────────────────────────────────
const DEFAULT_FLOORS=[];
const DEFAULT_SECTION_TRADES=[];
const BASE_TRADES=["Allcraft","Ascape","Atlantic","Bamco","Cooper","Danaos","Donaldson","Dynamic","F&G","FMB","Gotham","Jasper","Josloff","KF","LVC","Meadowlands","Persistent","Power","Pyramid","Riggs","Schindler","Sesso","Tagwall","Zuccarro","LIFD"];
function getKnownTrades(){
  const custom=load("mp-custom-trades",[]);
  return [...new Set([...BASE_TRADES,...custom])].sort();
}
let KNOWN_TRADES=getKnownTrades();

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
const newRow=()=>({id:uid(),trade:"",men:"",activity:""});
const newTRow=()=>({id:uid(),floor:"",activity:"",men:""});
const todayStr=()=>new Date().toLocaleDateString("en-US",{month:"2-digit",day:"2-digit",year:"2-digit"}).replace(/\//g,".");

function emptyNote(floors,sectionTrades){
  const f={};floors.forEach(fl=>{f[fl]=[newRow()]});
  const t={};sectionTrades.forEach(tr=>{t[tr]=[newTRow()]});
  return{id:uid(),type:"manpower",date:todayStr(),floors:f,floorOrder:[...floors],trades:t,customTrades:[],todo:[""],pinned:false,createdAt:Date.now(),updatedAt:Date.now()};
}
function focusNext(current){
  const modal=current.closest(".mp-modal");
  const inputs=modal?Array.from(modal.querySelectorAll("input:not([disabled]),textarea:not([disabled])")):[];
  const i=inputs.indexOf(current);
  if(i>-1&&inputs[i+1]){
    setTimeout(()=>inputs[i+1].focus(),50);
  }
}
function saveTemplate(floorOrder){
  save("mp-template",{floorOrder});
}
function loadTemplate(){
  return load("mp-template",null);
}

// ── Shared styles ─────────────────────────────────────────────────────────────
const fi=(ex={})=>({background:"#252525",border:"1px solid #2e2e2e",borderRadius:5,padding:"6px 9px",color:"#ddd",fontSize:13,outline:"none",boxSizing:"border-box",...ex});
const xB={background:"none",border:"none",color:"#ff3333",cursor:"pointer",fontSize:15,padding:"0 3px",lineHeight:1,flexShrink:0};
const addB={background:"#0e1e0e",border:"1px solid #2a4a2a",borderRadius:5,color:GR,cursor:"pointer",fontSize:13,padding:"5px 12px",fontWeight:700};

// ── Trade autocomplete ────────────────────────────────────────────────────────
function TradeInput({value,onChange,style}){
  const[show,setShow]=useState(false);
  const ref=useRef();
  const filtered=value.length>0?KNOWN_TRADES.filter(t=>t.toLowerCase().startsWith(value.toLowerCase())&&t.toLowerCase()!==value.toLowerCase()):[];
  useEffect(()=>{
    const h=e=>{if(ref.current&&!ref.current.contains(e.target))setShow(false)};
    document.addEventListener("mousedown",h);return()=>document.removeEventListener("mousedown",h);
  },[]);
  return(
    <div ref={ref} style={{position:"relative",flex:1,minWidth:0}}>
      <input value={value} onChange={e=>{onChange(e.target.value);setShow(true)}} onFocus={()=>setShow(true)} placeholder="Trade" style={{...style,width:"100%"}}/>
      {show&&filtered.length>0&&(
        <div style={{position:"absolute",top:"100%",left:0,right:0,zIndex:500,background:"#1a1a1a",border:"1px solid #333",borderRadius:6,boxShadow:"0 6px 20px rgba(0,0,0,.7)",marginTop:2,maxHeight:180,overflowY:"auto"}}>
          {filtered.map(t=>(
            <div key={t}
              onMouseDown={e=>{e.preventDefault();onChange(t);setShow(false);}}
              onTouchEnd={e=>{e.preventDefault();onChange(t);setShow(false);}}
              style={{padding:"10px 12px",fontSize:13,color:"#ccc",cursor:"pointer",borderBottom:"1px solid #222"}}
              onMouseEnter={e=>e.currentTarget.style.background="#2a2a2a"}
              onMouseLeave={e=>e.currentTarget.style.background="transparent"}
            >{t}</div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── Settings Modal ────────────────────────────────────────────────────────────
function SettingsModal({settings,onSave,onClose,onTradesUpdated}){
  const[secTrades,setSecTrades]=useState([...settings.sectionTrades]);
  const[newTrade,setNewTrade]=useState("");
  const[customTrades,setCustomTrades]=useState(()=>load("mp-custom-trades",[]));
  const[newKnownTrade,setNewKnownTrade]=useState("");
  function addKnownTrade(){
    const v=newKnownTrade.trim();
    if(!v||customTrades.includes(v)||BASE_TRADES.includes(v))return;
    const updated=[...customTrades,v];
    setCustomTrades(updated);
    save("mp-custom-trades",updated);
    KNOWN_TRADES=getKnownTrades();
    setNewKnownTrade("");
    if(onTradesUpdated)onTradesUpdated();
  }
  function removeKnownTrade(t){
    const updated=customTrades.filter(x=>x!==t);
    setCustomTrades(updated);
    save("mp-custom-trades",updated);
    KNOWN_TRADES=getKnownTrades();
    if(onTradesUpdated)onTradesUpdated();
  }

  function addFloor(){
    const v=newFloor.trim();
    if(!v)return;
    setFloors(f=>[v,...f]);
    setNewFloor("");
  }
  function addTrade(){
    const v=newTrade.trim();
    if(!v||secTrades.includes(v))return;
    setSecTrades(t=>[...t,v]);
    setNewTrade("");
  }

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.85)",zIndex:400,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={onClose}>

              <button onClick={()=>setSecTrades(secTrades.filter((_,j)=>j!==i))} style={xB}>✕</button>
            </div>
          ))}
        </div>
        <div style={{display:"flex",gap:6,marginBottom:20}}>
          <input value={newTrade} onChange={e=>setNewTrade(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addTrade()} placeholder="Add trade (e.g. Meadowlands)" style={{...fi(),flex:1}}/>
          <button onClick={addTrade} style={{background:A,color:"#111",border:"none",borderRadius:5,padding:"6px 14px",fontWeight:800,cursor:"pointer",fontSize:13}}>+</button>

          <div style={{maxHeight:140,overflowY:"auto",marginBottom:8}}>
            {customTrades.map(t=>(
              <div key={t} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"5px 8px",background:"#252525",borderRadius:5,marginBottom:4}}>

                <button onClick={()=>removeKnownTrade(t)} style={{background:"none",border:"none",color:"#ff3333",cursor:"pointer",fontSize:14,padding:0}}>✕</button>
              </div>
            ))}
            {customTrades.length===0&&<div style={{fontSize:11,color:"#444",fontStyle:"italic"}}>No custom trades yet.</div>}
          </div>
          <div style={{display:"flex",gap:6}}>
            <input value={newKnownTrade} onChange={e=>setNewKnownTrade(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addKnownTrade()} placeholder="Add trade to autocomplete…" style={{...fi(),flex:1}}/>
            <button onClick={addKnownTrade} style={{background:A,color:"#111",border:"none",borderRadius:5,padding:"6px 14px",fontWeight:800,cursor:"pointer",fontSize:13}}>+</button>
          </div>
        </div>
        <button onClick={()=>onSave({floors:settings.floors,sectionTrades:secTrades})} style={{width:"100%",background:A,color:"#111",border:"none",borderRadius:8,padding:"11px",fontWeight:800,fontSize:14,cursor:"pointer"}}>Save Settings</button>

    </div>
  );
}

// ── Manpower Modal ────────────────────────────────────────────────────────────
function makeReport(note,settings){
  let lines=[];
  lines.push("DAILY MANPOWER REPORT");
  lines.push("Date: "+note.date);
  lines.push("");
  let total=0;
  const floorList=note.floorOrder||settings.floors;
  floorList.forEach(f=>{
    const rows=(note.floors[f]||[]).filter(r=>r.trade||r.activity||r.men);
    if(rows.length){
      lines.push("Floor "+f);
      rows.forEach(r=>{
        const men=r.men?r.men:"";
        const parts=[];
        if(r.trade)parts.push(r.trade);
        if(men)parts.push(men);
        if(r.activity)parts.push(r.activity);
        lines.push("  - "+parts.join(" - "));
        total+=parseInt(r.men)||0;
      });
    }
  });
  const allTrades=[...settings.sectionTrades,...(note.customTrades||[])];
  const tradeLines=[];
  allTrades.forEach(t=>{
    const rows=(note.trades[t]||[]).filter(r=>r.floor||r.activity||r.men);
    if(rows.length){
      tradeLines.push(t+":");
      rows.forEach(r=>{
        const parts=[];
        if(r.floor)parts.push("Floor "+r.floor);
        if(r.activity)parts.push(r.activity);
        if(r.men)parts.push(r.men+" men");
        tradeLines.push("  - "+parts.join(" - "));
        total+=parseInt(r.men)||0;
      });
    }
  });
  if(tradeLines.length){lines.push("");lines.push("TRADES");tradeLines.forEach(l=>lines.push(l));}
  const todos=note.todo.filter(t=>t.trim());
  if(todos.length){lines.push("");lines.push("TO DO");todos.forEach(t=>lines.push("  • "+t));}

  const text=lines.join("\n");
  if(navigator.share){
    navigator.share({title:"Manpower Report "+note.date,text}).catch(()=>{});
  } else {
    navigator.clipboard.writeText(text).then(()=>alert("Report copied to clipboard!")).catch(()=>{
      const w=window.open("","_blank");
      w.document.write("<pre style='font-family:monospace;padding:20px;white-space:pre-wrap'>"+text+"</pre>");
    });
  }
}

  const delTR=(t,id)=>setDraft(d=>({...d,trades:{...d.trades,[t]:d.trades[t].filter(r=>r.id!==id)}}));

    const n="new_"+uid();

      const floorOrder=(d.floorOrder||[]).map(f=>f===oldKey?newKey:f);

function MpCard({note,onClick,onPin,floors}){
  const fl=note.floorOrder||floors;
  const total=fl.reduce((s,f)=>s+(note.floors[f]||[]).reduce((ss,r)=>ss+(parseInt(r.men)||0),0),0);
  const floorRows=fl.map(f=>{const rows=(note.floors[f]||[]).filter(r=>r.trade||r.activity);return rows.length?{f,n:rows.length}:null}).filter(Boolean);
  const todos=(Array.isArray(note.todo)?note.todo.join("\n"):note.todo||"").trim().split("\n").filter(t=>t.trim()).length;
  return(
    <div className="note-card" onClick={onClick} style={{background:"#141e14",border:"1px solid #1e301e",borderRadius:12,padding:"14px 12px 10px",position:"relative",cursor:"pointer",breakInside:"avoid",marginBottom:12,transition:"box-shadow .2s,transform .2s"}}>

      <div style={{fontSize:9,color:"#3a7a3a",letterSpacing:2,textTransform:"uppercase",marginBottom:3}}>Daily Manpower</div>
      <div style={{fontWeight:800,color:A,fontSize:14,marginBottom:10,paddingRight:22}}>{note.date}</div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"center",background:"#0a140a",borderRadius:8,padding:"8px 0",marginBottom:10}}>
        <span style={{fontSize:26,fontWeight:900,color:GR}}>{total}</span>
        <span style={{fontSize:10,color:"#4a7a4a",marginLeft:5,marginTop:3}}>men</span>
      </div>
      {floorRows.slice(0,5).map(({f,n})=>(
        <div key={f} style={{display:"flex",gap:6,fontSize:11,color:"#666",marginBottom:2}}>
          <span style={{color:A,fontWeight:700,minWidth:14}}>{f}</span>
          <span>{n} trade{n>1?"s":""}</span>

      ))}
      {todos>0&&<div style={{fontSize:10,color:"#4a5a4a",borderTop:"1px solid #1a2a1a",paddingTop:6,marginTop:6}}>✓ {todos} to-do</div>}
    </div>
  );
}

// ── General Note Card ─────────────────────────────────────────────────────────
const COLORS=[{n:"default",bg:"#1e1e1e"},{n:"red",bg:"#5c2121"},{n:"orange",bg:"#5c3a1e"},{n:"yellow",bg:"#4a4020"},{n:"green",bg:"#1e3d2a"},{n:"teal",bg:"#1a3a3a"},{n:"blue",bg:"#1a2a4a"},{n:"purple",bg:"#33204a"},{n:"pink",bg:"#4a1e38"}];

function NoteCard({note,onUpdate,onDelete,onPin,onCopy}){
  const[editing,setEditing]=useState(false);
  const[draft,setDraft]=useState({title:note.title,body:note.body});
  const[menu,setMenu]=useState(false);
  const[clr,setClr]=useState(false);
  const menuRef=useRef();
  const bg=(COLORS.find(c=>c.n===note.color)||COLORS[0]).bg;

  useEffect(()=>{
    const h=e=>{if(menuRef.current&&!menuRef.current.contains(e.target)){setMenu(false);setClr(false);}};
    document.addEventListener("mousedown",h);return()=>document.removeEventListener("mousedown",h);
  },[]);

  const save=()=>{onUpdate({...note,title:draft.title,body:draft.body});setEditing(false)};

  return(
    <div className="note-card" style={{background:bg,border:"1px solid #333",borderRadius:12,padding:"14px 14px 10px",position:"relative",cursor:editing?"default":"pointer",breakInside:"avoid",marginBottom:12,transition:"box-shadow .2s,transform .2s"}}
      onClick={()=>!editing&&setEditing(true)}>
      <button onClick={e=>{e.stopPropagation();onPin(note.id)}} style={{position:"absolute",top:10,right:36,background:"none",border:"none",cursor:"pointer",color:note.pinned?A:"#555",fontSize:13}}>📌</button>
      <div ref={menuRef} style={{position:"absolute",top:8,right:8}}>
        <button onClick={e=>{e.stopPropagation();setMenu(m=>!m);setClr(false)}} style={{background:"none",border:"none",cursor:"pointer",color:"#777",fontSize:18,padding:"2px 4px"}}>⋮</button>
        {menu&&(
          <div style={{position:"absolute",right:0,top:28,background:"#222",border:"1px solid #444",borderRadius:8,minWidth:140,zIndex:100,boxShadow:"0 4px 20px rgba(0,0,0,.6)"}} onClick={e=>e.stopPropagation()}>
            <button onClick={()=>setClr(c=>!c)} style={{display:"block",width:"100%",padding:"9px 14px",background:"none",border:"none",borderBottom:"1px solid #333",color:"#ddd",cursor:"pointer",textAlign:"left",fontSize:13}}>🎨 Color</button>
            {clr&&<div style={{padding:"6px 10px",display:"flex",gap:5,flexWrap:"wrap"}}>
              {COLORS.map(c=><button key={c.n} onMouseDown={()=>{onUpdate({...note,color:c.n});setMenu(false)}} style={{width:20,height:20,borderRadius:"50%",background:c.bg,border:note.color===c.n?`2px solid ${A}`:"2px solid #444",cursor:"pointer"}}/>)}
            </div>}
            <button onClick={()=>{onCopy(note);setMenu(false)}} style={{display:"block",width:"100%",padding:"9px 14px",background:"none",border:"none",borderBottom:"1px solid #333",color:"#ddd",cursor:"pointer",textAlign:"left",fontSize:13}}>📋 Copy</button>
            <button onClick={()=>{onDelete(note.id);setMenu(false)}} style={{display:"block",width:"100%",padding:"9px 14px",background:"none",border:"none",color:"#ddd",cursor:"pointer",textAlign:"left",fontSize:13}}>🗑 Delete</button>
          </div>
        )}
      </div>
      {editing?(
        <div onClick={e=>e.stopPropagation()}>
          <input autoFocus value={draft.title} onChange={e=>setDraft(d=>({...d,title:e.target.value}))} placeholder="Title"
            style={{width:"100%",background:"transparent",border:"none",color:"#f0f0f0",fontSize:15,fontWeight:700,outline:"none",marginBottom:6,paddingRight:60}}/>
          <textarea value={draft.body} onChange={e=>setDraft(d=>({...d,body:e.target.value}))}
            onKeyDown={e=>{
              if(e.key!=="Enter")return;
              const ta=e.target,val=ta.value,pos=ta.selectionStart;
              const m=val.slice(val.lastIndexOf("\n",pos-1)+1,pos).match(/^(\s*[-*]\s)/);
              if(!m)return;e.preventDefault();
              const nv=val.slice(0,pos)+"\n"+m[1]+val.slice(pos);
              setDraft(d=>({...d,body:nv}));
              requestAnimationFrame(()=>{ta.selectionStart=ta.selectionEnd=pos+1+m[1].length});
            }}
            placeholder="Note…" rows={4}
            style={{width:"100%",background:"transparent",border:"none",color:"#ccc",fontSize:13.5,outline:"none",resize:"vertical",lineHeight:1.6}}/>
          <div style={{display:"flex",justifyContent:"flex-end",marginTop:8}}>
            <button onClick={save} style={{background:A,color:"#111",border:"none",borderRadius:6,padding:"5px 16px",fontWeight:700,cursor:"pointer",fontSize:13}}>Done</button>
          </div>
        </div>
      ):(
        <>
          {note.title&&<div style={{fontWeight:700,fontSize:14.5,color:"#f0f0f0",marginBottom:5,paddingRight:60}}>{note.title}</div>}
          {note.body&&<div style={{fontSize:13.5,color:"#bbb",lineHeight:1.65,whiteSpace:"pre-wrap",wordBreak:"break-word"}}>{note.body}</div>}
          {!note.title&&!note.body&&<div style={{color:"#555",fontSize:13,fontStyle:"italic"}}>Empty note</div>}
        </>
      )}
      <div style={{fontSize:10,color:"#555",marginTop:8}}>{new Date(note.updatedAt).toLocaleDateString(undefined,{month:"short",day:"numeric"})}</div>
    </div>
  );
}

function NewNoteBar({onCreate}){
  const[exp,setExp]=useState(false);
  const[title,setTitle]=useState("");const[body,setBody]=useState("");
  const ref=useRef();
  useEffect(()=>{
    const h=e=>{
      if(ref.current&&!ref.current.contains(e.target)){
        if(title||body)onCreate({title,body});
        setExp(false);setTitle("");setBody("");
      }
    };
    document.addEventListener("mousedown",h);return()=>document.removeEventListener("mousedown",h);
  },[title,body]);
  return(
    <div ref={ref} style={{background:"#1e1e1e",border:"1px solid #333",borderRadius:12,padding:exp?"14px 16px":"12px 16px",marginBottom:12,cursor:"text"}} onClick={()=>setExp(true)}>
      {exp&&<input autoFocus value={title} onChange={e=>setTitle(e.target.value)} placeholder="Title"
        style={{width:"100%",background:"transparent",border:"none",color:"#f0f0f0",fontSize:15,fontWeight:700,outline:"none",marginBottom:8}}/>}
      <input value={exp?body:""} onChange={e=>setBody(e.target.value)} placeholder="Take a note…" readOnly={!exp}
        style={{width:"100%",background:"transparent",border:"none",color:exp?"#ccc":"#555",fontSize:14,outline:"none",cursor:"text"}}/>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App(){
  const[notes,setNotes]=useState(()=>load("mp-notes",[]));
  const[settings,setSettings]=useState(()=>load("mp-settings",{floors:DEFAULT_FLOORS,sectionTrades:DEFAULT_SECTION_TRADES}));
  const[search,setSearch]=useState("");
  const[view,setView]=useState("grid");
  const[open,setOpen]=useState(null);
  const[showSettings,setShowSettings]=useState(false);

  useEffect(()=>save("mp-notes",notes),[notes]);
  useEffect(()=>save("mp-settings",settings),[settings]);

  const addMp=()=>{const n=emptyNote([],settings.sectionTrades);setNotes(ns=>[n,...ns]);setOpen(n)};
  const addGeneral=({title,body})=>{
    if(!title&&!body)return;
    setNotes(ns=>[{id:uid(),type:"general",title,body,color:"default",pinned:false,createdAt:Date.now(),updatedAt:Date.now()},...ns]);
  };
  const saveMp=updated=>{setNotes(ns=>ns.map(n=>n.id===updated.id?{...updated,updatedAt:Date.now()}:n));setOpen(null)};
  const updateNote=updated=>setNotes(ns=>ns.map(n=>n.id===updated.id?{...updated,updatedAt:Date.now()}:n));
  const deleteNote=id=>{setNotes(ns=>ns.filter(n=>n.id!==id));setOpen(null)};
  const pinNote=id=>setNotes(ns=>ns.map(n=>n.id===id?{...n,pinned:!n.pinned}:n));
  const copyNote=note=>{
    const c={...JSON.parse(JSON.stringify(note)),id:uid(),pinned:false,createdAt:Date.now(),updatedAt:Date.now()};
    if(c.title)c.title+=" (copy)";if(c.date)c.date+=" (copy)";
    setNotes(ns=>{const i=ns.findIndex(x=>x.id===note.id);const a=[...ns];a.splice(i+1,0,c);return a});
  };
  const saveSettings=s=>{setSettings(s);setShowSettings(false)};

  const filtered=notes.filter(n=>{
    if(!search)return true;
    const q=search.toLowerCase();
    if(n.type==="manpower")return n.date?.toLowerCase().includes(q)||settings.floors.some(f=>(n.floors[f]||[]).some(r=>r.trade?.toLowerCase().includes(q)||r.activity?.toLowerCase().includes(q)));
    return n.title?.toLowerCase().includes(q)||n.body?.toLowerCase().includes(q);
  });
  const pinned=filtered.filter(n=>n.pinned);
  const others=filtered.filter(n=>!n.pinned);
  const col=view==="grid"?{columnCount:"auto",columnWidth:160,columnGap:12}:{display:"flex",flexDirection:"column"};

  const renderNote=n=>n.type==="manpower"
    ?<MpCard key={n.id} note={n} onClick={()=>setOpen(n)} onPin={pinNote} floors={settings.floors}/>
    :<NoteCard key={n.id} note={n} onUpdate={updateNote} onDelete={deleteNote} onPin={pinNote} onCopy={copyNote}/>;

  return(
    <div style={{background:"#111",minHeight:"100%",fontFamily:"'Georgia','Times New Roman',serif",color:"#f0f0f0"}}>
      {/* Header */}
      <div style={{position:"sticky",top:0,zIndex:200,background:"#151515",borderBottom:"1px solid #252525",padding:"11px 16px",display:"flex",alignItems:"center",gap:10}}>
        <span style={{fontSize:18}}>📋</span>
        <span style={{fontWeight:800,fontSize:16,letterSpacing:1,color:A}}>Manpower</span>
        <div style={{flex:1,maxWidth:340,margin:"0 auto"}}>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search…"
            style={{width:"100%",background:"#222",border:"1px solid #2e2e2e",borderRadius:8,padding:"7px 12px",color:"#e0e0e0",fontSize:13,outline:"none",boxSizing:"border-box"}}/>
        </div>
        <div style={{display:"flex",gap:4,marginLeft:"auto",alignItems:"center"}}>
          {["grid","list"].map(v=>(
            <button key={v} onClick={()=>setView(v)} style={{background:view===v?"#2a2a2a":"none",border:"1px solid "+(view===v?"#3a3a3a":"transparent"),borderRadius:5,color:view===v?A:"#555",padding:"4px 9px",cursor:"pointer",fontSize:15}}>
              {v==="grid"?"⊞":"☰"}
            </button>
          ))}
          <button onClick={()=>setShowSettings(true)} style={{background:"none",border:"none",cursor:"pointer",color:"#555",fontSize:18,padding:"4px 6px"}}>⚙️</button>
        </div>
      </div>

      {/* Body */}
      <div style={{maxWidth:860,margin:"0 auto",padding:"18px 14px"}}>
        <div style={{marginBottom:12}}>
          <button onClick={addMp} style={{background:"#132013",border:"1px solid #1e3a1e",borderRadius:10,color:GR,padding:"10px 16px",cursor:"pointer",fontWeight:800,fontSize:13,width:"100%"}}>
            👷 New Daily Manpower
          </button>
        </div>
        <NewNoteBar onCreate={addGeneral}/>

        {pinned.length>0&&<>
          <div style={{fontSize:9,letterSpacing:2,color:"#444",textTransform:"uppercase",marginBottom:8}}>Pinned</div>
          <div style={col}>{pinned.map(renderNote)}</div>
          {others.length>0&&<div style={{fontSize:9,letterSpacing:2,color:"#444",textTransform:"uppercase",margin:"16px 0 8px"}}>Others</div>}
        </>}
        <div style={col}>{others.map(renderNote)}</div>
        {filtered.length===0&&<div style={{textAlign:"center",color:"#333",marginTop:60,fontSize:14}}>{search?"No results.":"No notes yet."}</div>}
      </div>

      {open?.type==="manpower"&&<ManpowerModal note={open} onSave={saveMp} onClose={()=>setOpen(null)} onDelete={deleteNote} onCopy={n=>{copyNote(n);setOpen(null);}} settings={settings}/>}
      {showSettings&&<SettingsModal settings={settings} onSave={saveSettings} onClose={()=>setShowSettings(false)} onTradesUpdated={()=>setNotes(n=>[...n])}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
